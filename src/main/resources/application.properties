spring.application.name=interdisciplinar
 
# Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/virtualcup_db
spring.datasource.username=postgres
spring.datasource.password=postdba
 
# Atualizar as tabelas do banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update
 
# não formatar os comandos SQL no console
spring.jpa.properties.hibernate.format_sql=false
 
# Mostrar os comandos SQL no console
spring.jpa.show-sql=true
 
# Configurar a porta do servidor
server.port=8080

# Diagnóstico do Spring Security
logging.level.org.springframework.security=TRACE

# Diagnóstico do mapeamento de rotas
logging.level.org.springframework.web=DEBUG